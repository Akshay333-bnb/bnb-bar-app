<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15120f"><title>Barefoot & Beyond — Bar Inventory</title>
<style>
:root{--bg:#f5f0e8;--card:#fffdf9;--ink:#241d17;--muted:#75695f;--accent:#8b5e3c;--line:#e8ddd0;--danger:#a63d32;--ok:#4f7657;--warn:#a7792e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;padding:18px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand small{color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.brand h1{font-family:Georgia,serif;margin:3px 0;font-size:28px}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--card);padding:10px 14px;border-radius:12px;color:var(--ink)}.btn.primary{background:var(--ink);color:white;border-color:var(--ink)}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:18px}.tab{white-space:nowrap;border:0;background:transparent;padding:10px 13px;border-radius:999px;color:var(--muted)}.tab.active{background:var(--ink);color:white}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px}.stat .n{font-size:26px;font-weight:700;margin-top:5px}.stat small{color:var(--muted)}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}.panel h2{font:700 20px Georgia,serif;margin:0 0 13px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}.search{flex:1;min-width:190px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:white}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:14px}.table th{color:var(--muted);font-weight:600}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}.ok{background:#e7f0e8;color:var(--ok)}.warn{background:#f7eedc;color:var(--warn)}.danger{background:#f7e3e0;color:var(--danger)}.muted{color:var(--muted)}.empty{padding:30px;text-align:center;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:white}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:5}.modal.show{display:flex}.sheet{background:var(--card);width:min(620px,100%);border-radius:22px;padding:18px;max-height:90vh;overflow:auto}.sheethead{display:flex;justify-content:space-between;align-items:center}.sheet h3{font:700 22px Georgia,serif;margin:0 0 14px}.close{border:0;background:#eee;border-radius:50%;width:34px;height:34px}.footer{position:fixed;bottom:0;left:0;right:0;background:#fffdf9eF;border-top:1px solid var(--line);padding:10px;display:flex;justify-content:center;backdrop-filter:blur(10px)}.footer span{color:var(--muted);font-size:12px}.hide{display:none!important}.kpirow{display:flex;justify-content:space-between;gap:10px;align-items:center}.dangertext{color:var(--danger);font-weight:700}.success{color:var(--ok);font-weight:700}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.top{align-items:flex-start}.actions .btn span{display:none}.brand h1{font-size:24px}.app{padding-left:12px;padding-right:12px}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><small>Barefoot & Beyond</small><h1>Bar Inventory</h1></div><div class="actions"><button class="btn" onclick="exportData()">↥ <span>Backup</span></button><button class="btn primary" onclick="openModal('transaction')">+ <span>Stock</span></button></div></header>
<nav class="tabs"><button class="tab active" data-tab="dashboard">Dashboard</button><button class="tab" data-tab="inventory">Inventory</button><button class="tab" data-tab="transactions">Transactions</button><button class="tab" data-tab="products">Products</button></nav>
<main id="content"></main></div><div class="footer"><span>Offline-first • Data stays on this device</span></div>
<div class="modal" id="modal"><div class="sheet"><div class="sheethead"><h3 id="modalTitle"></h3><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script>
const seed=[['Bud Magnum','Beer',300,10],['Bud Premium','Beer',250,10],['Corona','Beer',250,10],['Tuborg','Beer',250,10],['Carlsberg','Beer',290,10],['Kingfisher Premium','Beer',200,10],['Kingfisher Strong','Beer',250,10],['UB Strong','Beer',250,10],['Breezer','RTD',200,10],['BuzzBall','RTD',180,10]];
let state=JSON.parse(localStorage.getItem('bb_inventory')||'null')||{products:seed.map((x,i)=>({id:i+1,name:x[0],category:x[1],sell:x[2],min:x[3]})),tx:[]};
function save(){localStorage.setItem('bb_inventory',JSON.stringify(state))}function qty(p){return state.tx.reduce((s,t)=>s+(t.productId===p.id?(t.type==='in'?t.qty:-t.qty):0),0)}function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0})}function dateStr(){return new Date().toISOString().slice(0,10)}
function render(tab='dashboard'){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let c=document.getElementById('content'); if(tab==='dashboard')c.innerHTML=dashboard();if(tab==='inventory')c.innerHTML=inventory();if(tab==='transactions')c.innerHTML=transactions();if(tab==='products')c.innerHTML=products();}
function dashboard(){let total=state.products.reduce((s,p)=>s+qty(p),0),low=state.products.filter(p=>qty(p)<=p.min),today=state.tx.filter(t=>t.date===dateStr()),sold=today.filter(t=>t.type==='out').reduce((s,t)=>s+t.qty,0),stockValue=state.products.reduce((s,p)=>s+qty(p)*p.sell,0);return `<section class="grid"><div class="stat"><small>Total units</small><div class="n">${total}</div></div><div class="stat"><small>Inventory value</small><div class="n">${money(stockValue)}</div></div><div class="stat"><small>Today's out</small><div class="n">${sold}</div></div><div class="stat"><small>Low stock</small><div class="n ${low.length?'dangertext':'success'}">${low.length}</div></div></section><section class="panel"><div class="kpirow"><h2>Low-stock alerts</h2><button class="btn" onclick="openModal('transaction','in')">+ Receive stock</button></div>${low.length?`<div class="tablewrap"><table class="table"><tr><th>Product</th><th>Current</th><th>Minimum</th><th>Status</th></tr>${low.map(p=>`<tr><td>${p.name}</td><td>${qty(p)}</td><td>${p.min}</td><td><span class="pill danger">Reorder</span></td></tr>`).join('')}</table></div>`:'<div class="empty">All products are above their minimum stock level.</div>'}</section><section class="panel"><h2>Quick actions</h2><div class="toolbar"><button class="btn primary" onclick="openModal('transaction','out')">− Record sale / consumption</button><button class="btn" onclick="openModal('transaction','in')">+ Add purchase</button><button class="btn" onclick="openModal('product')">＋ Add product</button></div></section>`}
function inventory(){return `<section class="panel"><div class="toolbar"><input class="search" placeholder="Search inventory…" oninput="filterInventory(this.value)"><button class="btn" onclick="openModal('transaction','in')">+ Stock In</button><button class="btn primary" onclick="openModal('transaction','out')">− Stock Out</button></div><div id="invtable">${invTable('')}</div></section>`}
function invTable(q){let ps=state.products.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())||p.category.toLowerCase().includes(q.toLowerCase()));return `<div class="tablewrap"><table class="table"><tr><th>Product</th><th>Category</th><th>Stock</th><th>Min</th><th>Selling</th><th>Status</th></tr>${ps.map(p=>{let q=qty(p);return `<tr><td><b>${p.name}</b></td><td>${p.category}</td><td><b>${q}</b></td><td>${p.min}</td><td>${money(p.sell)}</td><td><span class="pill ${q<=p.min?'danger':q<=p.min*2?'warn':'ok'}">${q<=p.min?'Low':q<=p.min*2?'Watch':'Healthy'}</span></td></tr>`}).join('')}</table></div>`}
function filterInventory(q){document.getElementById('invtable').innerHTML=invTable(q)}
function transactions(){let rows=[...state.tx].sort((a,b)=>b.created-a).slice(0,100);return `<section class="panel"><div class="kpirow"><h2>Transaction history</h2><button class="btn primary" onclick="openModal('transaction')">+ Transaction</button></div>${rows.length?`<div class="tablewrap"><table class="table"><tr><th>Date</th><th>Product</th><th>Type</th><th>Qty</th><th>Reason</th></tr>${rows.map(t=>{let p=state.products.find(x=>x.id===t.productId);return `<tr><td>${t.date}</td><td>${p?p.name:'Deleted'}</td><td><span class="pill ${t.type==='in'?'ok':'warn'}">${t.type==='in'?'IN':'OUT'}</span></td><td>${t.qty}</td><td>${t.reason||'—'}</td></tr>`}).join('')}</table></div>`:'<div class="empty">No transactions yet. Add your opening stock or first purchase.</div>'}</section>`}
function products(){return `<section class="panel"><div class="kpirow"><h2>Products & pricing</h2><button class="btn primary" onclick="openModal('product')">+ Add product</button></div><div class="tablewrap"><table class="table"><tr><th>Product</th><th>Category</th><th>Selling price</th><th>Minimum stock</th><th>Current</th><th></th></tr>${state.products.map(p=>`<tr><td><b>${p.name}</b></td><td>${p.category}</td><td>${money(p.sell)}</td><td>${p.min}</td><td>${qty(p)}</td><td><button class="btn" onclick="openModal('product',${p.id})">Edit</button></td></tr>`).join('')}</table></div></section>`}
function openModal(kind,arg){let m=document.getElementById('modal'),title=document.getElementById('modalTitle'),body=document.getElementById('modalBody');m.classList.add('show');if(kind==='transaction'){title.textContent=arg==='in'?'Add Stock In':arg==='out'?'Record Stock Out':'Record Transaction';body.innerHTML=`<form onsubmit="addTx(event)"><div class="formgrid"><div class="field"><label>Product</label><select id="txProduct" required>${state.products.map(p=>`<option value="${p.id}">${p.name} — current ${qty(p)}</option>`).join('')}</select></div><div class="field"><label>Transaction</label><select id="txType"><option value="in" ${arg==='in'?'selected':''}>Stock In / Purchase</option><option value="out" ${arg==='out'?'selected':''}>Stock Out</option></select></div><div class="field"><label>Quantity</label><input id="txQty" type="number" min="1" step="1" required></div><div class="field"><label>Date</label><input id="txDate" type="date" value="${dateStr()}" required></div><div class="field"><label>Reason</label><select id="txReason"><option>Sale</option><option>Purchase</option><option>Complimentary</option><option>Staff consumption</option><option>Wastage / breakage</option><option>Adjustment</option></select></div></div><button class="btn primary" style="margin-top:14px;width:100%">Save transaction</button></form>`}else{let p=typeof arg==='number'?state.products.find(x=>x.id===arg):null;title.textContent=p?'Edit Product':'Add Product';body.innerHTML=`<form onsubmit="saveProduct(event,${p?p.id:'null'})"><div class="formgrid"><div class="field"><label>Product name</label><input id="pName" required value="${p?p.name:''}"></div><div class="field"><label>Category</label><select id="pCat"><option ${p?.category==='Beer'?'selected':''}>Beer</option><option ${p?.category==='RTD'?'selected':''}>RTD</option><option ${p?.category==='Spirits'?'selected':''}>Spirits</option><option ${p?.category==='Wine'?'selected':''}>Wine</option><option ${p?.category==='Other'?'selected':''}>Other</option></select></div><div class="field"><label>Selling price (₹)</label><input id="pSell" type="number" min="0" value="${p?p.sell:''}" required></div><div class="field"><label>Minimum stock alert</label><input id="pMin" type="number" min="0" value="${p?p.min:10}" required></div></div><button class="btn primary" style="margin-top:14px;width:100%">Save product</button>${p?`<button type="button" class="btn" style="margin-top:8px;width:100%" onclick="deleteProduct(${p.id})">Delete product</button>`:''}</form>`}}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function addTx(e){e.preventDefault();let productId=+document.getElementById('txProduct').value,type=document.getElementById('txType').value,qtyn=+document.getElementById('txQty').value;if(type==='out'&&qtyn>qty(state.products.find(p=>p.id===productId))){alert('Not enough stock available.');return}state.tx.push({id:Date.now(),productId,type,qty:qtyn,date:document.getElementById('txDate').value,reason:document.getElementById('txReason').value,created:Date.now()});save();closeModal();render(document.querySelector('.tab.active').dataset.tab)}
function saveProduct(e,id){e.preventDefault();let obj={name:document.getElementById('pName').value.trim(),category:document.getElementById('pCat').value,sell:+document.getElementById('pSell').value,min:+document.getElementById('pMin').value};if(id){Object.assign(state.products.find(p=>p.id===id),obj)}else{obj.id=Date.now();state.products.push(obj)}save();closeModal();render('products')}
function deleteProduct(id){if(confirm('Delete this product? Existing transactions will remain.')){state.products=state.products.filter(p=>p.id!==id);save();closeModal();render('products')}}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='barefoot-bar-inventory-backup.json';a.click();URL.revokeObjectURL(a.href)}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>render(b.dataset.tab));render();
</script></body></html>
